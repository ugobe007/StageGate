<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StageGate Brand Preview</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&display=swap" rel="stylesheet" />
    <style>
      body { margin: 0; background: #1C1E22; color: #fff; font-family: Inter, system-ui, sans-serif; padding: 2rem; }
      .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1rem; max-width: 960px; }
      .card { border: 1px solid rgba(235,237,240,0.12); border-radius: 12px; padding: 1.5rem; display: flex; flex-direction: column; align-items: center; gap: 0.75rem; min-height: 140px; justify-content: center; background: rgba(255,255,255,0.02); }
      .card.light { background: #fff; color: #1C1E22; }
      .label { font-size: 0.65rem; letter-spacing: 0.12em; text-transform: uppercase; color: #5A5F64; }
    </style>
  </head>
  <body>
    <h1>StageGate [S/G] brand mark</h1>
    <p style="color:#5A5F64">Static preview · Emerald #00E87A</p>
    <div class="grid">
      <div class="card"><span class="label">Icon · 32px</span><svg width="32" height="14" viewBox="0 0 72 32"><text x="36" y="24" text-anchor="middle" font-family="'Space Grotesk', system-ui, sans-serif" font-size="22" font-weight="700" letter-spacing="-0.03em"><tspan fill="#00E87A">[</tspan><tspan fill="#FFFFFF">S</tspan><tspan fill="#00E87A">/</tspan><tspan fill="#FFFFFF">G</tspan><tspan fill="#00E87A">]</tspan></text></svg></div>
      <div class="card"><span class="label">Lockup · 128px</span><svg width="128" height="66" viewBox="0 0 132 68"><text x="66" y="26" text-anchor="middle" font-family="'Space Grotesk', system-ui, sans-serif" font-size="22" font-weight="700" letter-spacing="-0.03em"><tspan fill="#00E87A">[</tspan><tspan fill="#FFFFFF">S</tspan><tspan fill="#00E87A">/</tspan><tspan fill="#FFFFFF">G</tspan><tspan fill="#00E87A">]</tspan></text><text x="66" y="58" text-anchor="middle" font-family="'Space Grotesk', system-ui, sans-serif" font-size="13" font-weight="700" letter-spacing="0.14em"><tspan fill="#FFFFFF">STAGE</tspan><tspan fill="#00E87A">/</tspan><tspan fill="#00E87A">GATE</tspan></text></svg></div>
      <div class="card light"><span class="label">Light lockup</span><svg width="128" height="66" viewBox="0 0 132 68"><text x="66" y="26" text-anchor="middle" font-family="'Space Grotesk', system-ui, sans-serif" font-size="22" font-weight="700" letter-spacing="-0.03em"><tspan fill="#00E87A">[</tspan><tspan fill="#1C1E22">S</tspan><tspan fill="#00E87A">/</tspan><tspan fill="#1C1E22">G</tspan><tspan fill="#00E87A">]</tspan></text><text x="66" y="58" text-anchor="middle" font-family="'Space Grotesk', system-ui, sans-serif" font-size="13" font-weight="700" letter-spacing="0.14em"><tspan fill="#1C1E22">STAGE</tspan><tspan fill="#00E87A">/</tspan><tspan fill="#00E87A">GATE</tspan></text></svg></div>
    </div>
  </body>
</html>
